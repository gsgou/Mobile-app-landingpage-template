name: BP Copilot
description: 'Track, analyze, and improve.<br>Your blood pressure, decoded.'
full_description: '<strong>BP Copilot</strong> helps you track, analyze, and understand your blood pressure. See meaningful trends and day/night patterns instead of a wall of numbers.<br><br>Your readings sync from supported health platforms, while BP Copilot calculates additional insights such as <strong>pulse pressure (PP)</strong> and <strong>mean arterial pressure (MAP)</strong>.<br><br><strong>Ready for real doctor visits.</strong> Create a clean, dated PDF highlighting trends, averaged readings, day/night patterns, and values outside your chosen thresholds.<br><br><strong>Privacy first.</strong> Analysis and report generation happen entirely on your device. No cloud processing—your health data stays local unless you choose to export it.'

